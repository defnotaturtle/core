<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Hello World Canvas</title>
  <meta name="description" content="A simple HTML5, CSS, and JavaScript canvas starter with Hello World." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: #fff;
    }

    #appTitle {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 0.75rem 1rem;
      box-sizing: border-box;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: #111;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .app-shell {
      width: 100%;
      padding-top: 3.5rem;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="appTitle">canvas title</div>

  <main class="app-shell">
    <div class="content">
      <canvas id="helloCanvas" width="900" height="480"></canvas>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
