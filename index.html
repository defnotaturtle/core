<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World Canvas</title>
    <meta
      name="description"
      content="A simple HTML5, CSS, and JavaScript canvas starter with Hello World."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="content">
        <p class="eyebrow">HTML5 • CSS • JS</p>
        <h1>Canvas Starter</h1>
        <p class="tagline">A clean base project for building browser games and visual experiments.</p>
      </div>

      <canvas id="helloCanvas" width="900" height="480" aria-label="Hello World canvas"></canvas>
    </main>

    <script src="script.js"></script>
  </body>
</html>
